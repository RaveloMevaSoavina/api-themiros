name: themiros

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: themiros-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  # Traitement asynchrone de l'ingestion documentaire (spec §12.3). Plusieurs
  # réplicas peuvent tourner : la file PostgreSQL distribue les tâches.
  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: themiros-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    command: ["python", "-m", "app.modules.ingestion.worker"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

networks:
  backend:
