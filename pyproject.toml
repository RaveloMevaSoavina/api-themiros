[project]
name = "themiros-api"
version = "0.1.0"
description = "Themiros business and AI calculation API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<0.9",
  "httpx>=0.28,<1",
  "langdetect>=1.0.9,<2",
  "numpy>=2.1,<3",
  "openai>=2.26,<3",
  "opencv-python-headless>=4.10,<5",
  "openpyxl>=3.1,<4",
  "pycountry>=24.6,<27",
  "pymupdf>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "tiktoken>=0.9,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# Reconnaissance d'entités pour la détection du pays ; sans elle, le
# dictionnaire de pays seul est utilisé.
nlp = [
  "spacy>=3.8,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
